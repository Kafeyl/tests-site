<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f6f8fa;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(2px);
            z-index: 999;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .overlay.active {
            opacity: 1;
        }

        .sidebar-system {
            position: fixed;
            top: 0;
            left: 0;
            height: 100vh;
            display: flex;
            align-items: center;
            
            transform: translateX(-300px); 
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 1000;
            
            pointer-events: none; 
        }

        .sidebar-system.active {
            transform: translateX(0);
        }

        .sidebar-panel {
            width: 300px;
            height: 100vh;
            background-color: #ffffff;
            border-right: 1px solid #d0d7de;
            box-shadow: 4px 0 24px rgba(140, 149, 159, 0.2);
            box-sizing: border-box;
            padding: 30px 24px;
            
            pointer-events: auto; 
        }

        .sidebar-panel h2 {
            margin-top: 0;
            color: #24292f;
            font-size: 20px;
        }

        .sidebar-panel p {
            color: #57606a;
            line-height: 1.5;
            font-size: 14px;
        }

        .trigger-btn {
            background-color: #24292f;
            color: #ffffff;
            border: 1px solid #24292f;
            border-left: none;
            border-radius: 8px 0 0 8px; 
            padding: 16px 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            writing-mode: vertical-lr; 
            transform: rotate(180deg); 
            text-align: center;
            box-shadow: 4px 0 12px rgba(140, 149, 159, 0.15);
            transition: background-color 0.2s;
            
            pointer-events: auto; 
        }

        .sidebar-system.active .trigger-btn {
            background-color: #0969da; 
            border-color: #0969da;
        }

        .main-content {
            text-align: center;
            max-width: 500px;
            padding: 20px;
        }
    </style>
</head>
<body>

    <div class="overlay" id="overlay"></div>

    <div class="sidebar-system" id="sidebarSystem">

        <div class="sidebar-panel">
            <h2>Placeholder</h2>
            <p>Text</p>
        </div>

        <button class="trigger-btn" id="triggerBtn">Menu</button>
        
    </div>

    <div class="main-content">
        <h1>Text</h1>
        <p>Text</p>
    </div>

    <script>
        const sidebarSystem = document.getElementById('sidebarSystem');
        const triggerBtn = document.getElementById('triggerBtn');
        const overlay = document.getElementById('overlay');

        triggerBtn.addEventListener('mouseenter', () => {
            sidebarSystem.classList.add('active');
            overlay.classList.add('active');
        });

        sidebarSystem.addEventListener('mouseleave', () => {
            sidebarSystem.classList.remove('active');
            overlay.classList.remove('active');
        });
    </script>

</body>
</html>
